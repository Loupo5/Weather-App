<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Weather-App</title>
</head>
<body>
    <form action="#">
        <div>
            <input id="loc" type="text" maxlength="22" autofocus>
            <button id="search-btn" type="submit">Search</button>
        </div>
    </form>
    <dialog>
        <div class="left">
            <p id="location-name"></p>
            <div class="temp-degree">
                <p id="temp"></p><button id="degree" class="celsius"></button>
            </div>
        </div>

        <div class="right">
            <p id="conditions"></p>
            <p id="feelslike"></p>
            <p id="humidity"></p>
            <p id="uvindex"></p>
        </div>
        <div class="img-div">
            <img src="#" id="weather-img">
        </div>
    </dialog>
</body>
</html>
